[package]
name = "lan-mouse-egui"
description = "egui / eframe frontend for lan-mouse"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/zibo-chen/lan-mouse-egui"

[dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
